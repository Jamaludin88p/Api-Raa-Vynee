<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZuraDev Tools — TikTok &amp; YouTube Downloader</title>
<meta name="description" content="Tempel tautan TikTok atau YouTube, pilih format, langsung unduh." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs.css">
</head>
<body>

<div class="docs-wrap">

  <header class="docs-topbar">
    <span class="docs-title">ZURADEV TOOLS</span>
    <div class="docs-topbar-actions">
      <a class="icon-btn" href="docs.html" aria-label="Buka dokumentasi API">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 9h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </a>
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 1110.5 4a6.2 6.2 0 009.5 10.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="docs-main">

    <section class="intro">
      <h1 class="api-name">ZuraDev Tools</h1>
      <p class="lede">
        Tempel tautan TikTok atau YouTube, pilih format, langsung unduh.
        Tanpa watermark, tanpa iklan tambahan.
      </p>
    </section>

    <section class="grab-section">
      <form id="grabberForm" autocomplete="off">
        <label for="urlInput" class="block-label">tautan</label>
        <input
          id="urlInput"
          name="url"
          type="url"
          inputmode="url"
          class="text-input"
          placeholder="https://vt.tiktok.com/... atau https://youtu.be/..."
          required
        />

        <div class="format-field" id="formatRow" hidden>
          <label for="formatSelect" class="block-label">format</label>
          <select id="formatSelect" class="text-input">
            <option value="mp4">MP4 — video</option>
            <option value="mp3">MP3 — audio</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" id="ctaButton">Proses tautan</button>
      </form>

      <p class="status-text" id="statusText"></p>

      <div class="result-box" id="resultBox" hidden>
        <img id="resultThumb" class="result-thumb" alt="" hidden>
        <div class="result-info">
          <p class="result-title" id="resultTitle"></p>
          <p class="result-meta" id="resultMeta"></p>
        </div>
        <a class="btn-primary" id="downloadBtn" href="#" target="_blank" rel="noopener">Unduh</a>
      </div>
    </section>

    <footer class="docs-foot">
      <span>dibangun oleh ZuraDev</span>
      <span class="dot">·</span>
      <a href="docs.html">dokumentasi api</a>
    </footer>

  </main>
</div>

<script src="script.js"></script>
<script src="docs.js"></script>
</body>
</html>
